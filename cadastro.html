<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Cursos | Cadastro</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/cadastro.css">
</head>
<body class="auth-page">
        <!-- O cadastro mantém somente os dados essenciais para não complicar o projeto nesta primeira versão. -->
<main class="auth-shell">
        <section class="auth-intro">
            <a class="brand brand-light" href="index.html">Gestão<span>+</span></a>
            <div>
                <p class="eyebrow light">NOVO ALUNO</p>
                <h1>Crie sua conta e comece a explorar.</h1>
                <p>Seu cadastro será usado para autenticação e para identificar suas matrículas.</p>
            </div>
            <a class="back-link" href="index.html">Voltar para o início</a>
        </section>

        <section class="auth-card wide-card" aria-labelledby="register-title">
            <p class="eyebrow">CADASTRO</p>
            <h2 id="register-title">Criar uma conta</h2>
            <p class="form-intro">Informe seus dados básicos para começar.</p>

            <form>
                <div class="form-grid">
                    <div>
                        <label for="name">Nome completo</label>
                        <input type="text" id="name" name="name" placeholder="Seu nome" required>
                    </div>
                    <div>
                        <label for="phone">Telefone</label>
                        <input type="tel" id="phone" name="phone" placeholder="(11) 99999-9999">
                    </div>
                </div>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>

                <div class="form-grid">
                    <div>
                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" placeholder="Mínimo de 6 caracteres" required>
                    </div>
                    <div>
                        <label for="password-confirm">Confirmar senha</label>
                        <input type="password" id="password-confirm" name="password-confirm" placeholder="Repita a senha" required>
                    </div>
                </div>

                <label class="check-row"><input type="checkbox" required> <span>Li e concordo com os termos de uso do sistema.</span></label>
                <button class="button primary full" type="submit">Criar conta</button>
            </form>

            <p class="auth-footer-text">Já possui uma conta? <a href="login.html">Entrar</a></p>
        </section>
    </main>
</body>
</html>
