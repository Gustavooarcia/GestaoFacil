<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Cursos | Login</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page">
        <!-- O formulário está visualmente pronto; a autenticação real será ligada ao Supabase Auth depois. -->
<main class="auth-shell">
        <section class="auth-intro">
            <a class="brand brand-light" href="index.html">Gestão<span>+</span></a>
            <div>
                <p class="eyebrow light">BEM-VINDO DE VOLTA</p>
                <h1>Acesse sua área de estudos.</h1>
                <p>Entre com sua conta para visualizar suas matrículas, cursos e perfil.</p>
            </div>
            <a class="back-link" href="index.html">Voltar para o início</a>
        </section>

        <section class="auth-card" aria-labelledby="login-title">
            <p class="eyebrow">ACESSO</p>
            <h2 id="login-title">Entrar na plataforma</h2>
            <p class="form-intro">Preencha seus dados para continuar.</p>

            <form>
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>

                <div class="label-row">
                    <label for="password">Senha</label>
                    <a href="#">Esqueci minha senha</a>
                </div>
                <input type="password" id="password" name="password" placeholder="Digite sua senha" required>

                <label class="check-row"><input type="checkbox" name="remember"> <span>Manter sessão iniciada</span></label>
                <button class="button primary full" type="submit">Entrar</button>
            </form>

            <div class="auth-divider"><span>ou</span></div>
            <p class="auth-footer-text">Ainda não possui conta? <a href="cadastro.html">Criar cadastro</a></p>
        </section>
    </main>
</body>
</html>
